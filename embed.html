<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Embed — StegApp</title>
<link rel="stylesheet" href="style.css">
</head><body>
<header class="topbar">
  <a class="brand" href="index.html">Steg<span>App</span></a>
  <nav class="ops">
    <a href="embed.html">Embed</a>
    <a href="extract.html">Extract</a>
    <a href="detect.html">Detect</a>
    <a href="crack.html">Crack</a>
    <a href="info.html">Information</a>
  </nav>
</header>
<main>
<section class="panel">
  <h2>Embed</h2>
  <p class="lede">Hide a secret file inside a cover carrier. The passphrase (if given)
     is required later to extract it.</p>
  <form data-endpoint="/api/embed" data-mode="file" data-name="stego.out">
    <label>Cover file
      <span class="hint">Carrier to hide data in — JPEG, BMP, WAV, or AU.</span>
      <input type="file" name="cover" accept=".jpg,.jpeg,.bmp,.wav,.au" required>
    </label>
    <label>Secret file
      <span class="hint">The payload to embed.</span>
      <input type="file" name="secret" required>
    </label>
    <label>Passphrase
      <span class="hint">Optional, but strongly recommended.</span>
      <input type="password" name="passphrase" autocomplete="off">
    </label>
    <div class="actions"><button class="btn">Embed</button></div>
    <p class="out" role="status"></p>
  </form>
</section>
</main>
<script src="common.js"></script>
</body></html>
