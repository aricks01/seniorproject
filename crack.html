<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crack — StegApp</title>
<link rel="stylesheet" href="style.css">
</head><body>
<header class="topbar">
  <a class="brand" href="index.html">Steg<span>App</span></a>
  <nav class="ops">
    <a href="embed.html">Embed</a>
    <a href="extract.html">Extract</a>
    <a href="detect.html">Detect</a>
    <a href="crack.html">Crack</a>
    <a href="info.html">Information</a>
  </nav>
</header>
<main>
<section class="panel">
  <h2>Crack</h2>
  <p class="lede">Run a wordlist against a stego file to recover an unknown passphrase.
     Pick a server-side wordlist or upload your own. Requires an API key (top right).</p>
  <form data-endpoint="/api/crack" data-mode="job">
    <label>Stego file
      <input type="file" name="stego" required>
    </label>
    <label>Server wordlist
      <select name="wordlist_name"></select>
    </label>
    <label>…or upload a wordlist
      <span class="hint">Overrides the selection above when provided.</span>
      <input type="file" name="wordlist" accept=".txt,.lst">
    </label>
    <div class="actions">
      <button class="btn">Start crack</button>
      <button type="button" class="btn ghost" data-cancel hidden>Cancel</button>
    </div>
    <div class="bar"><i></i></div>
    <p class="out" role="status"></p>
  </form>
</section>
</main>
<script src="common.js"></script>
</body></html>
