<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Extract — StegApp</title>
<link rel="stylesheet" href="style.css">
</head><body>
<header class="topbar">
  <a class="brand" href="index.html">Steg<span>App</span></a>
  <nav class="ops">
    <a href="embed.html">Embed</a>
    <a href="extract.html">Extract</a>
    <a href="detect.html">Detect</a>
    <a href="crack.html">Crack</a>
    <a href="info.html">Information</a>
  </nav>
</header>
<main>
<section class="panel">
  <h2>Extract</h2>
  <p class="lede">Recover a hidden payload from a stego file. Supply the passphrase it
     was embedded with.</p>
  <form data-endpoint="/api/extract" data-mode="file" data-name="extracted.bin">
    <label>Stego file
      <span class="hint">The carrier containing hidden data.</span>
      <input type="file" name="stego" required>
    </label>
    <label>Passphrase
      <input type="password" name="passphrase" autocomplete="off">
    </label>
    <div class="actions"><button class="btn">Extract</button></div>
    <p class="out" role="status"></p>
  </form>
</section>
</main>
<script src="common.js"></script>
</body></html>
